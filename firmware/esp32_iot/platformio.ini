; PlatformIO Project Configuration File for Smart SiC SSCB IoT Gateway
; Target: ESP32-WROOM-32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -I include
